<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Drop Animation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* Falling drops */
    .drop, .star {
      position: absolute;
      top: -10px;
      border-radius: 50%;
      animation: fall linear infinite;
    }

    .drop {
      width: 8px;
      height: 8px;
      background: white;
    }

    .star {
      width: 10px;
      height: 10px;
      background: gold;
      box-shadow: 0 0 8px gold;
    }

    @keyframes fall {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

    /* Center photo */
    .profile-pic {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      margin: 20px;
      border: 4px solid white;
      z-index: 2;
    }

    .intro {
      max-width: 600px;
      text-align: center;
      font-size: 18px;
      line-height: 1.5;
      padding: 10px 20px;
      z-index: 2;
    }
  </style>
</head>
<body>
  <script>
    const body = document.body;
    // White drops
    for (let i = 0; i < 30; i++) {
      const drop = document.createElement("div");
      drop.className = "drop";
      drop.style.left = Math.random() * window.innerWidth + "px";
      drop.style.animationDuration = (2 + Math.random() * 3) + "s";
      drop.style.animationDelay = Math.random() * 5 + "s";
      body.appendChild(drop);
    }
    // Golden stars
    for (let i = 0; i < 20; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.left = Math.random() * window.innerWidth + "px";
      star.style.animationDuration = (3 + Math.random() * 4) + "s";
      star.style.animationDelay = Math.random() * 6 + "s";
      body.appendChild(star);
    }
  </script>

  <!-- Profile section -->
  <img src="ashuimg.jpg" alt="Person Photo" class="profile-pic">
  <div class="intro">
    <p>
      Hi, I’m Ashutosh Raj! <br> A passionate web developer who loves crafting 
      beautiful user experiences and solving real-world problems 
      with technology. 🚀<br>
      Young Entreprenuer, and a tech enthusiast.
      I enjoy learning new technologies and sharing knowledge with others.
    </p>
  </div>
</body>
</html>
